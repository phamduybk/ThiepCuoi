<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 526">
<!-- Cổng cung đình (tự vẽ) bao ảnh vòm: ảnh nằm ở x48..348, y108..508 (3:4). Mái ngói hoàng lưu ly 2 tầng, trụ lam viền vàng. -->
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset=".55" stop-color="#d6a73a"/><stop offset="1" stop-color="#a77a12"/></linearGradient>
  <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a77a12"/><stop offset=".5" stop-color="#f6dc8c"/><stop offset="1" stop-color="#a77a12"/></linearGradient>
  <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27509f"/><stop offset="1" stop-color="#16316c"/></linearGradient>
  <pattern id="tile" width="7" height="30" patternUnits="userSpaceOnUse"><path d="M3.5 0V30" stroke="#8a620c" stroke-width="1.1" opacity=".55"/></pattern>
  <pattern id="key" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 10.5H12V1.5H3V7.5H9V4.5H6" fill="none" stroke="#e9c66a" stroke-width="1.2"/></pattern>
</defs>
<!-- bậc nền -->
<rect x="0" y="514" width="396" height="12" fill="url(#l)"/>
<rect x="4" y="508" width="388" height="7" fill="url(#gh)"/>
<!-- trụ -->
<g>
  <rect x="8" y="98" width="38" height="412" fill="url(#l)"/>
  <rect x="350" y="98" width="38" height="412" fill="url(#l)"/>
  <g fill="none" stroke="#e2bb57" stroke-width="1.3">
    <rect x="13" y="114" width="28" height="388"/><rect x="355" y="114" width="28" height="388"/>
  </g>
  <rect x="5" y="98" width="44" height="12" fill="url(#gh)"/><rect x="347" y="98" width="44" height="12" fill="url(#gh)"/>
  <rect x="5" y="496" width="44" height="12" fill="url(#gh)"/><rect x="347" y="496" width="44" height="12" fill="url(#gh)"/>
  <!-- huy chương sen trên trụ -->
  <g id="med" fill="#e9c66a">
    <path d="M27 152l9 12-9 12-9-12z"/><circle cx="27" cy="164" r="3" fill="#1e3f86"/>
    <path d="M27 286c5 6 5 14 0 20-5-6-5-14 0-20zM27 306c-6-1-11-6-12-12 6 1 11 6 12 12zM27 306c6-1 11-6 12-12-6 1-11 6-12 12z"/>
    <path d="M18 312h18" stroke="#e9c66a" stroke-width="1.4"/>
    <path d="M27 428l9 12-9 12-9-12z"/><circle cx="27" cy="440" r="3" fill="#1e3f86"/>
    <path d="M27 180V276M27 318V420" stroke="#e9c66a" stroke-width=".9" opacity=".55"/>
  </g>
  <use href="#med" x="342"/>
</g>
<!-- tam giác góc (spandrel) lam + mây vàng -->
<path d="M46 100H350V258H348A150 150 0 0 0 48 258H46Z" fill="url(#l)"/>
<g id="sp" fill="none" stroke="#e9c66a" stroke-width="1.5" stroke-linecap="round">
  <path d="M60 132a12 12 0 1 1 12 12a8 8 0 1 1-8-8a4 4 0 1 1 4 4"/>
  <path d="M84 132c10 0 14-12 28-12c9 0 12 7 7 10c-3 2-6-1-4-3"/>
  <path d="M72 156c-8 0-12 6-10 12M56 168a6 6 0 1 1 6 6a3 3 0 1 1-3-3"/>
  <path d="M120 112h40M128 106h20" opacity=".55"/>
  <circle cx="98" cy="146" r="1.8" fill="#e9c66a" stroke="none"/>
</g>
<use href="#sp" transform="translate(396 0) scale(-1 1)"/>
<!-- khung vòm vàng quanh ảnh -->
<path d="M45 510V258A153 153 0 0 1 351 258V510" fill="none" stroke="url(#gh)" stroke-width="5"/>
<path d="M52.5 508V258A145.5 145.5 0 0 1 343.5 258V508" fill="none" stroke="#fbf1d0" stroke-width="1.1" opacity=".85"/>
<!-- diềm hồi văn dưới mái -->
<rect x="4" y="84" width="388" height="16" fill="url(#l)"/>
<rect x="4" y="86" width="388" height="12" fill="url(#key)"/>
<path d="M4 84H392M4 100H392" stroke="#e2bb57" stroke-width="1.4"/>
<!-- mái dưới (ngói hoàng lưu ly) -->
<path d="M0 64C18 76 34 74 46 62L78 48H318L350 62C362 74 378 76 396 64C390 80 372 88 352 86H44C24 88 6 80 0 64Z" fill="url(#g)"/>
<path d="M46 62L78 48H318L350 62C346 74 338 84 330 86H66C58 84 50 74 46 62Z" fill="url(#tile)"/>
<path d="M0 64C18 76 34 74 46 62L78 48H318L350 62C362 74 378 76 396 64" fill="none" stroke="#1e3f86" stroke-width="2.4"/>
<path d="M2 66c-6-6-2-16 6-14 6 2 4 10-2 9" fill="none" stroke="#1e3f86" stroke-width="2" stroke-linecap="round"/>
<path d="M394 66c6-6 2-16-6-14-6 2-4 10 2 9" fill="none" stroke="#1e3f86" stroke-width="2" stroke-linecap="round"/>
<!-- tầng giữa: biển ngạch -->
<rect x="104" y="36" width="188" height="14" fill="url(#l)"/>
<path d="M104 36H292M104 50H292" stroke="#e2bb57" stroke-width="1.2"/>
<rect x="162" y="32" width="72" height="22" fill="#1e3f86" stroke="url(#gh)" stroke-width="2.4"/>
<rect x="166.5" y="36.5" width="63" height="13" fill="none" stroke="#e9c66a" stroke-width=".8"/>
<g fill="#e9c66a"><circle cx="198" cy="43" r="3.2"/><circle cx="186" cy="43" r="1.6"/><circle cx="210" cy="43" r="1.6"/><circle cx="176" cy="43" r="1"/><circle cx="220" cy="43" r="1"/></g>
<!-- mái trên -->
<path d="M92 34C104 40 114 38 122 30L140 20H256L274 30C282 38 292 40 304 34C298 44 286 40 280 40H116C110 40 98 44 92 34Z" fill="url(#g)"/>
<path d="M122 30L140 20H256L274 30C270 36 266 39 262 40H134C130 39 126 36 122 30Z" fill="url(#tile)"/>
<path d="M92 34C104 40 114 38 122 30L140 20H256L274 30C282 38 292 40 304 34" fill="none" stroke="#1e3f86" stroke-width="2"/>
<rect x="138" y="16" width="120" height="5" fill="#1e3f86"/>
<!-- đầu đao cuộn mây -->
<path d="M140 17c-8-2-12-10-6-14 5-3 10 2 7 6-2 2-5 1-5-1" fill="none" stroke="#1e3f86" stroke-width="2" stroke-linecap="round"/>
<path d="M256 17c8-2 12-10 6-14-5-3-10 2-7 6 2 2 5 1 5-1" fill="none" stroke="#1e3f86" stroke-width="2" stroke-linecap="round"/>
<!-- hồ lô / mặt trời giữa nóc -->
<g fill="url(#gh)" stroke="#1e3f86" stroke-width="1.2">
  <circle cx="198" cy="9" r="6.5"/>
  <path d="M188 16h20l-3 3h-14z"/>
</g>
<g stroke="#c9961a" stroke-width="1.2" stroke-linecap="round"><path d="M198 0V-2M186 9h-4M214 9h-4M189.5 1.5l-2-2M206.5 1.5l2-2"/></g>
</svg>
